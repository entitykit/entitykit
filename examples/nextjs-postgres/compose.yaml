services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: entitykit_next_demo
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d entitykit_next_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - entitykit-next-postgres:/var/lib/postgresql

volumes:
  entitykit-next-postgres:
