name: Feature proposal
description: Propose a recurring use case or public contract change.
title: "proposal: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the recurring application or database problem before proposing an API.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Real example
      description: Show the model, query, migration, or workflow you need and the result you expect.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract and failure behavior
      description: Explain provider differences, tracking or transaction effects, and what should happen on failure.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Explain what you use today and why the existing public API or an escape hatch is insufficient.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I have considered whether this belongs in core, one provider, the CLI, testing, or application code.
          required: true
