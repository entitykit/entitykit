name: Mutation qualification

on:
  schedule:
    - cron: '31 5 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Run every mutation campaign with fresh results
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        description: Require complete fresh mutation qualification
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan mutation qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.plan.outputs.mode }}
      has-work: ${{ steps.plan.outputs.has-work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Plan mutation campaigns
        id: plan
        env:
          MUTATION_MODE: ${{ (github.event_name == 'schedule' || inputs.full) && 'full' || 'pr' }}
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MUTATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/plan-mutation.js "$MUTATION_MODE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-plan
          path: coverage/mutation/plan.json
          if-no-files-found: error

  campaign:
    name: Mutation ${{ matrix.id }}
    needs: [plan]
    if: needs.plan.outputs.has-work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.plan.outputs.mode == 'full' && 240 || 30 }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      # Reuse only reports with identical SDK, tests, fixtures, dependencies,
      # configuration and runner inputs. PRs can restore but never save them.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: coverage/mutation-incremental/${{ matrix.id }}.json
          key: mutation-v1-${{ runner.os }}-node22.13-${{ matrix.id }}-${{ hashFiles('package*.json', 'tsconfig*.json', 'packages/**/src/**', 'tests/**', 'scripts/**', 'config/**') }}
      - name: Run mutation campaign
        env:
          MUTATION_JOB: ${{ matrix.id }}
          MUTATION_MODE: ${{ needs.plan.outputs.mode }}
        run: node scripts/run-mutation.js "$MUTATION_JOB" "$MUTATION_MODE"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: coverage/mutation-incremental/${{ matrix.id }}.json
          key: mutation-v1-${{ runner.os }}-node22.13-${{ matrix.id }}-${{ hashFiles('package*.json', 'tsconfig*.json', 'packages/**/src/**', 'tests/**', 'scripts/**', 'config/**') }}
      - name: Retain campaign reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.id }}
          path: |
            coverage/mutation/${{ matrix.id }}.json
            coverage/mutation/${{ matrix.id }}.html
            coverage/mutation/${{ matrix.id }}.result.json
          if-no-files-found: error

  summary:
    name: Require mutation score floors
    needs: [plan, campaign]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every planned campaign to finish
        env:
          HAS_WORK: ${{ needs.plan.outputs.has-work }}
          RESULT: ${{ needs.campaign.result }}
        run: test "$HAS_WORK" = false || test "$RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-*
          path: coverage/mutation
          merge-multiple: true
      - run: node scripts/check-mutation-reports.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-summary
          path: coverage/mutation/summary.json
          if-no-files-found: error
