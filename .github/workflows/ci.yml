name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Release alpha calls this workflow for the ref it is publishing, so the
  # release gate is this gate rather than a hand-copied subset of it.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.13.0, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  coverage:
    name: Runtime coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  mutation:
    name: Critical-path mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run test:mutation

  postgres:
    name: Live Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: entitykit
          POSTGRES_PASSWORD: entitykit
          POSTGRES_DB: entitykit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entitykit -d entitykit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://entitykit:entitykit@127.0.0.1:5432/entitykit_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  mysql:
    name: Live MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: entitykit
          MYSQL_DATABASE: entitykit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pentitykit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MYSQL_URL: mysql://root:entitykit@127.0.0.1:3306/entitykit_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run test:integration:mysql

  nextjs:
    name: Next.js 16 + Postgres demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: entitykit
          POSTGRES_PASSWORD: entitykit
          POSTGRES_DB: entitykit_nextjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entitykit -d entitykit_nextjs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://entitykit:entitykit@127.0.0.1:5432/entitykit_nextjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:check --workspace @entitykit/example-nextjs-postgres
      - run: npm run db:migrate:dry --workspace @entitykit/example-nextjs-postgres
      - run: npm run db:migrate --workspace @entitykit/example-nextjs-postgres
      - run: npm run db:status --workspace @entitykit/example-nextjs-postgres
      - run: npm run build --workspace @entitykit/example-nextjs-postgres
      - name: Install the Playwright browser
        working-directory: examples/nextjs-postgres
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @entitykit/example-nextjs-postgres
