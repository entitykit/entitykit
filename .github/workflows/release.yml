name: Release alpha

# Manual dispatch only. There is no push, tag, schedule or pull_request
# trigger: nothing publishes EntityKit except a human typing the confirmation
# phrase into this workflow's dispatch form, from main, with the complete CI
# matrix green on the exact commit the published tarballs are packed from.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-alpha to publish every workspace under the alpha dist-tag.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-alpha
  cancel-in-progress: false

jobs:
  confirm:
    name: Confirm the alpha publication
    runs-on: ubuntu-latest
    steps:
      - name: Require the publish-alpha confirmation phrase
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "publish-alpha" ]; then
            echo "Refusing to publish: confirm must be exactly 'publish-alpha'." >&2
            exit 1
          fi

  guard:
    name: Guard the release ref
    runs-on: ubuntu-latest
    steps:
      # Every job below needs this one. A dispatch can name any branch or tag,
      # and the evidence a release rests on is only as good as the ref it was
      # collected from, so a release from anywhere but main stops here.
      - name: Require refs/heads/main
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Refusing to publish from $REF: releases run from refs/heads/main." >&2
            exit 1
          fi
          echo "Releasing $REF at $SHA."

  ci:
    name: Complete release matrix
    needs: [confirm, guard]
    # Every lane CI runs, invoked for this dispatch's ref: verify on Node
    # 22.13 and Node 24, runtime coverage, the critical-path mutation score,
    # live Postgres, live MySQL, and the Next.js/Postgres browser flow. Calling
    # the workflow instead of restating
    # a subset of it is what keeps the release gate from drifting behind the
    # branch gate.
    uses: ./.github/workflows/ci.yml

  evidence:
    name: Pack the release tarballs
    needs: [confirm, guard, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      # One operation compiles the workspaces, packs them into tarballs/, and
      # runs every acceptance stage — the unassisted consumer install, Node16
      # and NodeNext types, the CommonJS and ESM runtimes, the single-core
      # invariant, the installed CLI bin, and the peer-skew refusal — against
      # those exact files, then leaves them in place. Nothing repacks them
      # afterwards, so the files uploaded below are the files that were
      # accepted, byte for byte. The PACKAGE_INTEGRITY lines it prints are the
      # SHA-512 SRIs the publish and promote jobs check the registry against.
      - name: Build, pack and accept the seven workspaces
        run: ENTITYKIT_PACKAGE_OUTPUT_DIR="$PWD/tarballs" npm run check:package
      # These seven files are the release. Everything downstream downloads and
      # publishes them byte for byte; no job after this one compiles anything.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs
          path: tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the alpha candidates
    needs: [confirm, guard, ci, evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance attestations are signed with the workflow's OIDC identity.
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    outputs:
      version: ${{ steps.preflight.outputs.version }}
    steps:
      # Deliberately no checkout: this job holds no working tree, so it cannot
      # publish anything except the artifacts the evidence job packed.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: tarballs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          registry-url: https://registry.npmjs.org

      # One version for the whole family, and exactly the seven identities this
      # release is allowed to be. Applied migrations stamp history with
      # entityKitMigrationVersion, and the packages peer on core at an exact
      # version, so seven tarballs that disagree are not a release. Comparing the
      # sorted names against the literal roster — rather than counting them —
      # refuses a set that is short one package, carries a duplicate, or
      # carries an eighth nobody expected.
      - name: Preflight the packed tarballs
        id: preflight
        run: |
          set -euo pipefail
          names=()
          versions=()
          for tarball in tarballs/*.tgz; do
            manifest=$(tar -xzOf "$tarball" package/package.json)
            name=$(printf '%s' "$manifest" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
            version=$(printf '%s' "$manifest" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            echo "$name@$version <- $tarball"
            names+=("$name")
            versions+=("$version")
          done
          roster=$(printf '%s\n' \
            "@entitykit/cli" "@entitykit/core" "@entitykit/mysql" "@entitykit/nestjs" \
            "@entitykit/postgres" "@entitykit/sqlite" "@entitykit/testing")
          if [ "$(printf '%s\n' "${names[@]}" | sort)" != "$roster" ]; then
            echo "Refusing to publish: expected exactly the seven @entitykit packages, found ${names[*]}." >&2
            exit 1
          fi
          distinct=$(printf '%s\n' "${versions[@]}" | sort -u)
          if [ "$(printf '%s\n' "$distinct" | wc -l | tr -d ' ')" != "1" ]; then
            echo "Refusing to publish: the tarballs carry versions ${versions[*]}." >&2
            exit 1
          fi
          if [[ ! "$distinct" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Refusing to publish: $distinct is not an -alpha.N prerelease version." >&2
            exit 1
          fi
          if ! current=$(npm view "@entitykit/core@alpha" version 2>view.err); then
            echo "Refusing to publish: could not resolve the current @entitykit/core alpha version." >&2
            cat view.err >&2
            exit 1
          fi
          current=$(printf '%s' "$current" | tr -d '[:space:]')
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Refusing to publish: current alpha version $current is not comparable." >&2
            exit 1
          fi
          if ! node -e '
            const parts = value => value.match(/\d+/gu).map(Number);
            const next = parts(process.argv[1]);
            const current = parts(process.argv[2]);
            for (let index = 0; index < next.length; index += 1) {
              if (next[index] === current[index]) continue;
              process.exit(next[index] > current[index] ? 0 : 1);
            }
          ' "$distinct" "$current"; then
            echo "Refusing to publish: $distinct is older than current alpha $current." >&2
            exit 1
          fi
          if [ "$distinct" = "$current" ]; then
            echo "Accepting same-version retry for $distinct; registry integrity still decides each package."
          else
            echo "Accepting forward alpha movement from $current to $distinct."
          fi
          echo "version=$distinct" >> "$GITHUB_OUTPUT"

      # Stage A. Publishing a tarball does not run prepublishOnly, so
      # scripts/guard-alpha-publish.js — which refuses any publish whose
      # dist-tag is not alpha — never fires in this job. What stands in its
      # place: every publish below names --tag alpha-candidate explicitly, so
      # nothing reaches the alpha tag here at all; the alpha tag only moves in
      # the promote job, after all seven candidates exist; and this workflow runs
      # by hand, from main, behind the confirmation phrase.
      #
      # Each step asks the registry what bytes it already holds for this
      # version and decides between exactly three outcomes: a clean E404 means
      # the version is absent, so publish it; an integrity equal to the packed
      # tarball's means this is a re-dispatch of a run that died partway, so
      # skip it; an integrity that differs means the registry holds other bytes
      # under the version being released, and the release stops. Any other npm
      # failure — network, auth — is never read as absence.
      #
      # Every $tarball below is absolute, and that is load-bearing. npm reads
      # the argument as a package spec, and a relative path carrying a slash
      # but no ./ or file: prefix parses as GitHub shorthand — owner/repo —
      # sending npm to git ls-remote instead of to the local file. A leading
      # $PWD leaves no reading but the file.

      - name: Publish @entitykit/core
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$PWD/tarballs/entitykit-core-$VERSION.tgz"
          packed="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 | tr -d '\n')"
          if published=$(npm view "@entitykit/core@$VERSION" dist.integrity 2>view.err); then
            published=$(printf '%s' "$published" | tr -d '[:space:]')
            if [ "$published" != "$packed" ]; then
              echo "Refusing to publish: @entitykit/core@$VERSION is already on the registry with different bytes." >&2
              echo "  registry: $published" >&2
              echo "  packed:   $packed" >&2
              echo "A published version is immutable. Bump the version and dispatch again." >&2
              exit 1
            fi
            echo "Skipping @entitykit/core@$VERSION: already on the registry with the packed bytes, $packed."
            exit 0
          fi
          if ! grep -q E404 view.err; then
            echo "Refusing to publish: npm view @entitykit/core@$VERSION failed for some reason other than an absent version." >&2
            cat view.err >&2
            exit 1
          fi
          npm publish "$tarball" --provenance --tag alpha-candidate

      - name: Publish @entitykit/sqlite
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$PWD/tarballs/entitykit-sqlite-$VERSION.tgz"
          packed="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 | tr -d '\n')"
          if published=$(npm view "@entitykit/sqlite@$VERSION" dist.integrity 2>view.err); then
            published=$(printf '%s' "$published" | tr -d '[:space:]')
            if [ "$published" != "$packed" ]; then
              echo "Refusing to publish: @entitykit/sqlite@$VERSION is already on the registry with different bytes." >&2
              echo "  registry: $published" >&2
              echo "  packed:   $packed" >&2
              echo "A published version is immutable. Bump the version and dispatch again." >&2
              exit 1
            fi
            echo "Skipping @entitykit/sqlite@$VERSION: already on the registry with the packed bytes, $packed."
            exit 0
          fi
          if ! grep -q E404 view.err; then
            echo "Refusing to publish: npm view @entitykit/sqlite@$VERSION failed for some reason other than an absent version." >&2
            cat view.err >&2
            exit 1
          fi
          npm publish "$tarball" --provenance --tag alpha-candidate

      - name: Publish @entitykit/postgres
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$PWD/tarballs/entitykit-postgres-$VERSION.tgz"
          packed="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 | tr -d '\n')"
          if published=$(npm view "@entitykit/postgres@$VERSION" dist.integrity 2>view.err); then
            published=$(printf '%s' "$published" | tr -d '[:space:]')
            if [ "$published" != "$packed" ]; then
              echo "Refusing to publish: @entitykit/postgres@$VERSION is already on the registry with different bytes." >&2
              echo "  registry: $published" >&2
              echo "  packed:   $packed" >&2
              echo "A published version is immutable. Bump the version and dispatch again." >&2
              exit 1
            fi
            echo "Skipping @entitykit/postgres@$VERSION: already on the registry with the packed bytes, $packed."
            exit 0
          fi
          if ! grep -q E404 view.err; then
            echo "Refusing to publish: npm view @entitykit/postgres@$VERSION failed for some reason other than an absent version." >&2
            cat view.err >&2
            exit 1
          fi
          npm publish "$tarball" --provenance --tag alpha-candidate

      - name: Publish @entitykit/mysql
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$PWD/tarballs/entitykit-mysql-$VERSION.tgz"
          packed="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 | tr -d '\n')"
          if published=$(npm view "@entitykit/mysql@$VERSION" dist.integrity 2>view.err); then
            published=$(printf '%s' "$published" | tr -d '[:space:]')
            if [ "$published" != "$packed" ]; then
              echo "Refusing to publish: @entitykit/mysql@$VERSION is already on the registry with different bytes." >&2
              echo "  registry: $published" >&2
              echo "  packed:   $packed" >&2
              echo "A published version is immutable. Bump the version and dispatch again." >&2
              exit 1
            fi
            echo "Skipping @entitykit/mysql@$VERSION: already on the registry with the packed bytes, $packed."
            exit 0
          fi
          if ! grep -q E404 view.err; then
            echo "Refusing to publish: npm view @entitykit/mysql@$VERSION failed for some reason other than an absent version." >&2
            cat view.err >&2
            exit 1
          fi
          npm publish "$tarball" --provenance --tag alpha-candidate

      - name: Publish @entitykit/nestjs
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$PWD/tarballs/entitykit-nestjs-$VERSION.tgz"
          packed="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 | tr -d '\n')"
          if published=$(npm view "@entitykit/nestjs@$VERSION" dist.integrity 2>view.err); then
            published=$(printf '%s' "$published" | tr -d '[:space:]')
            if [ "$published" != "$packed" ]; then
              echo "Refusing to publish: @entitykit/nestjs@$VERSION is already on the registry with different bytes." >&2
              echo "  registry: $published" >&2
              echo "  packed:   $packed" >&2
              echo "A published version is immutable. Bump the version and dispatch again." >&2
              exit 1
            fi
            echo "Skipping @entitykit/nestjs@$VERSION: already on the registry with the packed bytes, $packed."
            exit 0
          fi
          if ! grep -q E404 view.err; then
            echo "Refusing to publish: npm view @entitykit/nestjs@$VERSION failed for some reason other than an absent version." >&2
            cat view.err >&2
            exit 1
          fi
          npm publish "$tarball" --provenance --tag alpha-candidate

      - name: Publish @entitykit/testing
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$PWD/tarballs/entitykit-testing-$VERSION.tgz"
          packed="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 | tr -d '\n')"
          if published=$(npm view "@entitykit/testing@$VERSION" dist.integrity 2>view.err); then
            published=$(printf '%s' "$published" | tr -d '[:space:]')
            if [ "$published" != "$packed" ]; then
              echo "Refusing to publish: @entitykit/testing@$VERSION is already on the registry with different bytes." >&2
              echo "  registry: $published" >&2
              echo "  packed:   $packed" >&2
              echo "A published version is immutable. Bump the version and dispatch again." >&2
              exit 1
            fi
            echo "Skipping @entitykit/testing@$VERSION: already on the registry with the packed bytes, $packed."
            exit 0
          fi
          if ! grep -q E404 view.err; then
            echo "Refusing to publish: npm view @entitykit/testing@$VERSION failed for some reason other than an absent version." >&2
            cat view.err >&2
            exit 1
          fi
          npm publish "$tarball" --provenance --tag alpha-candidate

      - name: Publish @entitykit/cli
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$PWD/tarballs/entitykit-cli-$VERSION.tgz"
          packed="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 | tr -d '\n')"
          if published=$(npm view "@entitykit/cli@$VERSION" dist.integrity 2>view.err); then
            published=$(printf '%s' "$published" | tr -d '[:space:]')
            if [ "$published" != "$packed" ]; then
              echo "Refusing to publish: @entitykit/cli@$VERSION is already on the registry with different bytes." >&2
              echo "  registry: $published" >&2
              echo "  packed:   $packed" >&2
              echo "A published version is immutable. Bump the version and dispatch again." >&2
              exit 1
            fi
            echo "Skipping @entitykit/cli@$VERSION: already on the registry with the packed bytes, $packed."
            exit 0
          fi
          if ! grep -q E404 view.err; then
            echo "Refusing to publish: npm view @entitykit/cli@$VERSION failed for some reason other than an absent version." >&2
            cat view.err >&2
            exit 1
          fi
          npm publish "$tarball" --provenance --tag alpha-candidate

  promote:
    name: Promote the alpha dist-tag
    needs: [confirm, guard, ci, evidence, publish]
    runs-on: ubuntu-latest
    # Moving a dist-tag signs nothing, so this job holds no OIDC identity.
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      # The same artifact the publish job worked from, so the tags can be
      # checked against the accepted bytes rather than against a name.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: tarballs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          registry-url: https://registry.npmjs.org

      # The alpha tag is what users resolve, so it may only ever land on the
      # exact bytes this release accepted. Existence is not enough: a version
      # the registry holds from an earlier partial run carries the same name
      # and number as the one in hand and different bytes. All seven are checked
      # before the first tag moves, so a family that fails this check is never
      # half-promoted.
      - name: Require the registry to hold the accepted bytes
        run: |
          set -euo pipefail
          for name in core sqlite postgres mysql nestjs testing cli; do
            tarball="$PWD/tarballs/entitykit-$name-$VERSION.tgz"
            if [ ! -f "$tarball" ]; then
              echo "Refusing to promote: $tarball is missing from the release artifact." >&2
              exit 1
            fi
            packed="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 | tr -d '\n')"
            if ! published=$(npm view "@entitykit/$name@$VERSION" dist.integrity 2>view.err); then
              echo "Refusing to promote: npm view @entitykit/$name@$VERSION failed." >&2
              cat view.err >&2
              exit 1
            fi
            published=$(printf '%s' "$published" | tr -d '[:space:]')
            if [ "$published" != "$packed" ]; then
              echo "Refusing to promote: @entitykit/$name@$VERSION on the registry is not the accepted tarball." >&2
              echo "  registry: $published" >&2
              echo "  packed:   $packed" >&2
              exit 1
            fi
            echo "Verified @entitykit/$name@$VERSION $packed"
          done

      # Stage B. Seven dist-tag moves against packages that already exist. Each
      # move gets bounded retries, then a final loop proves the public family is
      # coherent before the workflow can finish green.
      - name: Move the alpha dist-tag onto the published version
        run: |
          set -euo pipefail
          for name in core sqlite postgres mysql nestjs testing cli; do
            moved=false
            for attempt in 1 2 3; do
              if npm dist-tag add "@entitykit/$name@$VERSION" alpha; then
                moved=true
                break
              fi
              if [ "$attempt" != "3" ]; then
                echo "Retrying @entitykit/$name alpha tag after attempt $attempt." >&2
                sleep "$((attempt * 2))"
              fi
            done
            if [ "$moved" != "true" ]; then
              echo "Alpha promotion stopped at @entitykit/$name after three attempts; rerun this release to converge the family." >&2
              exit 1
            fi
          done
          for name in core sqlite postgres mysql nestjs testing cli; do
            tagged=$(npm view "@entitykit/$name@alpha" version | tr -d '[:space:]')
            if [ "$tagged" != "$VERSION" ]; then
              echo "Alpha promotion verification failed: @entitykit/$name resolves to $tagged, expected $VERSION." >&2
              exit 1
            fi
            echo "Verified @entitykit/$name@alpha -> $VERSION"
          done
